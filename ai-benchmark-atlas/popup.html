<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Benchmark Atlas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="atlas-popup">

    <!-- Header -->
    <header class="atlas-header">
      <div class="atlas-header-left">
        <span class="atlas-logo">🧠</span>
        <div>
          <h1>AI Benchmark Atlas</h1>
          <p class="atlas-tagline">Offline AI Benchmark Knowledge Base</p>
        </div>
      </div>
      <div class="atlas-header-right">
        <button id="btn-check-updates" class="atlas-icon-btn" title="Check for updates">🔄</button>
        <button id="btn-open-full" class="atlas-icon-btn" title="Open full reference">📖</button>
      </div>
    </header>

    <!-- Update Banner -->
    <div id="update-banner" class="atlas-update-banner" style="display: none;">
      <span id="update-banner-text">2 new benchmarks available</span>
      <button id="btn-review-updates" class="atlas-link-btn">Review</button>
    </div>

    <!-- Connection Status -->
    <div id="connection-status" class="atlas-connection">
      <span id="connection-dot" class="atlas-dot atlas-dot-offline"></span>
      <span id="connection-text">Offline — Using local knowledge base</span>
    </div>

    <!-- Search -->
    <div class="atlas-search-wrap">
      <input
        type="text"
        id="search-input"
        class="atlas-search"
        placeholder="Search benchmarks..."
        autocomplete="off"
      >
      <span class="atlas-search-icon">🔍</span>
    </div>

    <!-- Category Filters -->
    <div class="atlas-categories" id="category-filters">
      <!-- Generated by JS -->
    </div>

    <!-- Benchmark List -->
    <div class="atlas-list" id="benchmark-list">
      <!-- Generated by JS -->
    </div>

    <!-- Footer -->
    <footer class="atlas-footer">
      <span id="benchmark-count">12 benchmarks</span>
      <span>•</span>
      <span id="last-updated">Local only</span>
    </footer>

  </div>

  <script src="data/benchmarks.js"></script>
  <script src="popup.js"></script>
</body>
</html>
